}

function renderDailyMeta() {
  $('#dSub').textContent = state.total + ' รายการ · รอผลตรวจ ' + state.openCount + ' รายการ';
  $('#dChips').innerHTML = Object.entries(state.typeCounts).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => '<div class="chip"><i class="dot" style="background:' + TCOL[typeIdx(k)] + '"></i>' + esc(k) + '<b>' + v + '</b></div>').join('');
}

/** ส่วนบนของสมุดคุมคำร้อง: ปุ่มปี + ปุ่มเดือน + หัวเรื่อง (ไม่แตะช่องค้นหาและตาราง) */
function renderBookTop() {
  if (state.frame !== 'book' || !$('#bkMonths')) return;
  const y = state.by, m = state.bm, ms = state.bookMonths || [];
  const byKey = {};
  ms.forEach(x => { byKey[x.key] = x; });
  const isAll = y === 'all';
  $('#bkYears').innerHTML = isAll ? '' : '<span class="bk-legend">ตัวเลข = จำนวนคำร้อง · สีส้ม = รอผลตรวจ · ✓ = ตรวจครบ</span>';   // เลือกปีที่เมนูซ้ายแล้ว
  $('#bkMonths').hidden = isAll;

  const tile = (key, label, t, o, all, full) =>
    '<button class="mtile' + (all ? ' all' : '') + (t ? '' : ' zero') + '" type="button" data-bm="' + key + '" aria-pressed="' + (key === m) + '"'
    + ' title="' + full + ' · ' + (t ? t.toLocaleString('th-TH') + ' รายการ' + (o ? ' · รอผลตรวจ ' + o : ' · ตรวจครบ') : 'ไม่มีคำร้อง') + '">'
    + '<span class="m">' + label + '</span><span class="c">' + (t ? t.toLocaleString('th-TH') : '–') + '</span>'
    + '<span class="o' + (t && !o ? ' ok' : '') + '">' + (t ? (o ? 'รอ ' + o : '✓') : '') + '</span>'
    + '</button>';
  let tiles = '';
  if (y && !isAll) {
    tiles = tile('', 'ทั้งปี', ms.reduce((a, x) => a + x.total, 0), ms.reduce((a, x) => a + x.open, 0), true, 'ทั้งปี ' + (+y + 543));
    for (let i = 1; i <= 12; i++) {
      const key = y + '-' + pad(i), x = byKey[key], d = new Date(2000, i - 1, 1);
      tiles += tile(key, d.toLocaleDateString('th-TH', { month: 'short' }), x ? x.total : 0, x ? x.open : 0, false,
        d.toLocaleDateString('th-TH', { month: 'long' }) + ' ' + (+y + 543));
    }
  }
  $('#bkMonths').innerHTML = tiles;
  $('#bkSub').textContent = isAll
    ? 'ทุกปี · ' + (state.bd ? 'วันที่ ' + fmt(state.bd, { day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' : 'ค้นหาได้ข้ามทุกปี · ') + state.total.toLocaleString('th-TH') + ' รายการ · รอผลตรวจ ' + state.openCount + ' รายการ'
    : y
    ? 'ปี พ.ศ. ' + (+y + 543) + ' · ' + (state.bd ? 'วันที่ ' + fmt(state.bd, { day: 'numeric', month: 'long', year: 'numeric' }) : (m ? fmtM(m) : 'ทั้งปี')) + ' · ' + state.total.toLocaleString('th-TH') + ' รายการ · รอผลตรวจ ' + state.openCount + ' รายการ'
    : 'ยังไม่มีข้อมูลคำร้อง';
}

/** รายการเลือกวันที่ของเดือนที่เลือกอยู่ (1 - จำนวนวันของเดือนนั้น) ใช้ได้เมื่อเลือกเดือนแล้วเท่านั้น */
function fillBookDays() {
  const sel = $('#bd');
  if (!sel) return;
  const m = state.bm;
  if (!/^\d{4}-\d{2}$/.test(m)) {   // ทั้งปี / ทุกปี: ยังไม่เลือกเดือน เลือกวันไม่ได้
    state.bd = '';
    sel.innerHTML = '<option value="">เลือกเดือนก่อน</option>';
    sel.disabled = true;
    return;
  }
  if (state.bd && state.bd.slice(0, 7) !== m) state.bd = '';
  const n = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  let o = '<option value="">ทุกวัน</option>';
  for (let i = 1; i <= n; i++) o += '<option value="' + pad(i) + '">' + i + '</option>';
  sel.innerHTML = o;
  sel.disabled = false;
  sel.value = state.bd ? state.bd.slice(8, 10) : '';
}

function renderBook() {
  if (state.frame !== 'book' || !$('#tbl')) return;
  fillBookDays();
  renderBookTop();
  renderBookFilters();
  $('#tbl').innerHTML = tableHtml(state.rows, 'ไม่พบคำร้องในช่วงที่เลือก', 'fit');
  $('#pager').innerHTML = pagerHtml(true);
}

/** วาดเฉพาะส่วนที่เปลี่ยน (ไม่แตะช่องค้นหา/ตัวกรอง) */
function renderList() {
  if (state.frame !== state.view || !$('#tbl')) return;
  if (state.view === 'book') { renderBook(); return; }
  if (state.view === 'all') {
    $('#allSub').textContent = 'พบ ' + state.total.toLocaleString('th-TH') + ' รายการ' + (state.year ? ' ของปี ' + (+state.year + 543) : '');
    fillFilters();
    $('#tbl').innerHTML = tableHtml(state.rows, 'ไม่พบรายการที่ตรงกับตัวกรอง');
    $('#pager').innerHTML = pagerHtml(true);
  } else {
    renderDailyMeta();
    $('#tbl').innerHTML = tableHtml(state.rows, 'ไม่มีคำร้องในวันที่เลือก', 'fit');
    $('#pager').innerHTML = pagerHtml(false);
  }
}

/* =====================================================================
   8. รายละเอียดคำร้อง (ลิ้นชักด้านขวา)
   ===================================================================== */
function closeDrawer() {
  $('#dwrap').hidden = true;
  state.detail = null;
  state.detailData = null;
}

async function openDetail(id) {
  state.detail = id;
  const row = state.rows.find(r => r.id === id);
  state.detailData = row || null;
  $('#dwrap').hidden = false;
  if (row) renderDrawer(true);       // แสดงข้อมูลจากตารางก่อน แล้วค่อยโหลดประวัติ
  else $('#drawer').innerHTML = '<div class="empty">กำลังโหลดรายละเอียดและประวัติ…</div>';
  await loadDetail(id);
}

async function loadDetail(id) {
  try {
    const r = await call('getRequest', [id, rnOf(id)], true);
    if (state.detail !== id) return;
    state.detailData = r;
    renderDrawer(false);
  } catch (e) {
    if (state.detail === id) $('#drawer').innerHTML = '<div class="empty">' + esc(errMsg(e)) + '</div>';
  }
}

function copyText(t) {
  const done = () => toast('คัดลอกแล้ว');
  const fb = () => {
    const a = document.createElement('textarea');
    a.value = t; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('คัดลอกไม่สำเร็จ'); }
    a.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}

function renderDrawer(historyLoading) {
  const r = state.detailData;
  if (!r) return;
  const has = v => v != null && String(v).trim() !== '' && String(v).trim() !== '-';
  const cp = t => '<button class="cp" type="button" data-copy="' + esc(t) + '" title="คัดลอก">คัดลอก</button>';
  const kv = (k, v, extra) => '<div class="kv"><dt>' + k + '</dt><dd>' + (has(v) ? esc(v) : '-') + (has(v) && extra ? extra : '') + '</dd></div>';
  const hidden = [];
  const opt = (k, v) => { if (has(v)) return kv(k, v); hidden.push(k); return ''; };   // ช่องว่างไม่แสดง รวมเป็นบรรทัดเดียวท้ายรายการ
  const digits = String(r.phone || '').replace(/\D/g, '');
  const phoneVal = has(r.phone)
    ? ((/^[\d\s\-]+$/.test(r.phone) && digits.length >= 9 && digits.length <= 10) ? '<a href="tel:' + digits + '" target="_top">' + esc(r.phone) + '</a>' : esc(r.phone)) + cp(r.phone)
    : '-';
  const types = splitMulti(r.type);
  const typeHtml = types.length ? '<div class="chs">' + types.map(x => '<span class="chp">' + esc(x) + '</span>').join('') + '</div>' : '-';
  const detail = '<div class="kv"><dt>ประเภทคำร้อง</dt><dd>' + typeHtml + '</dd></div>'
    + kv('เฟส · ขนาด', (r.phase || '-') + (r.size && r.size !== '-' ? ' · ' + r.size : ''))
    + opt('เฟสที่เชื่อมต่อ', r.inPhase) + opt('ขนาดเสา', r.pole) + opt('สายจดหน่วย', r.route) + opt('หมายเหตุ', r.note)
    + kv('แหล่งข้อมูล', r.src);
  $('#drawer').innerHTML =
    '<div class="dhead"><div class="dh"><div style="flex:1;min-width:0"><h3>' + esc(r.name || '(ไม่ระบุชื่อ)') + '</h3>'
    + '<div class="dmeta"><span class="dno">' + esc(r.no || '-') + '</span>' + (r.no ? cp(r.no) : '') + '<span>รับเมื่อ ' + fmt(r.date) + '</span></div></div>'
    + '<button class="dx" type="button" data-close="1" aria-label="ปิด">✕</button></div></div>'
    + '<div class="dbody">'
    + '<div class="dsec">สถานะ</div>' + statusCell(r, true)
    + ((r.reason || state.canWrite) ? '<div class="dsec">สาเหตุ</div><div style="white-space:pre-wrap;font-size:14px">' + reasonCell(r, true) + '</div>' : '')
    + '<div class="dsec">ข้อมูลลูกค้า</div><dl style="margin:0">'
    + kv('ชื่อผู้ขอ', r.name)
    + kv('ที่อยู่', r.address, cp(r.address))
    + '<div class="kv"><dt>เบอร์โทร</dt><dd>' + phoneVal + '</dd></div></dl>'
    + '<div class="dsec">รายละเอียดงาน</div><dl style="margin:0">' + detail + '</dl>'
    + (hidden.length ? '<div class="dnone">ยังไม่มีข้อมูล: ' + hidden.join(', ') + '</div>' : '')
    + '</div>'
    + (state.canWrite
      ? '<div class="dact"><button class="btn pri" type="button" data-edit="' + esc(r.id) + '">แก้ไขข้อมูล</button><span class="sp"></span>'
        + (state.canDelete ? '<button class="lnk bad" type="button" data-del="' + esc(r.id) + '">ลบคำร้อง</button>' : '') + '</div>'
      : '');
}

/* =====================================================================
   9. เปลี่ยนสถานะ (อัปเดตหน้าจอทันที บันทึกเบื้องหลัง ไม่มีแถบโหลด)
   ===================================================================== */
const statusQueues = new Map();   // id -> promise ต่อคิว บันทึกตามลำดับที่กด

function enqueue(id, task) {
  const p = (statusQueues.get(id) || Promise.resolve()).then(task, task);
  statusQueues.set(id, p);
  p.then(() => { if (statusQueues.get(id) === p) statusQueues.delete(id); });
  return p;
}

function currentStatus(id) {
  const row = state.rows.find(r => r.id === id);
  if (row) return row.status;
  return state.detailData && state.detailData.id === id ? state.detailData.status : '';
}

/** ตั้งสถานะในข้อมูลบนหน้าจอ + ตัวเลข "ค้างดำเนินการ" + สีของปุ่ม */
function setRowStatus(id, v) {
  const row = state.rows.find(r => r.id === id);
  if (row) {
    if (state.view === 'daily' && isDone(row) !== isDone({ status: v })) state.openCount += isDone({ status: v }) ? -1 : 1;
    if (state.view === 'book' && isDone(row) !== isDone({ status: v })) {
      const d = isDone({ status: v }) ? -1 : 1, x = (state.bookMonths || []).find(z => z.key === String(row.date).slice(0, 7));
      if (x) x.open += d;
      state.openCount += d;
    }
    row.status = v;
  }
  if (state.detailData && state.detailData.id === id) state.detailData.status = v;
  $$('select[data-st]').forEach(s => {
    if (s.dataset.st !== id) return;
    s.value = v;
    s.className = 'st ' + statusCls(v) + (s.classList.contains('big') ? ' big' : '');
  });
  if (state.view === 'daily' && $('#dSub')) renderDailyMeta();
  if (state.view === 'book') renderBookTop();
}

/** เลขแถวในชีตของรายการนี้ (ตัวช่วยให้เซิร์ฟเวอร์หาแถวเร็ว) */
function rnOf(id) {
  const row = state.rows.find(r => r.id === id);
  return row && row.rn ? row.rn : (state.detailData && state.detailData.id === id && state.detailData.rn) || 0;
}
/** เซิร์ฟเวอร์บอกเลขรุ่นข้อมูลหลังบันทึก ถ้าไม่มีใครแก้แทรกมา ถือว่าเรารู้รุ่นล่าสุดแล้ว ไม่ต้องโหลดรายการซ้ำ */
function noteVer(res) {
  if (res && res.ver && lastVer !== null && lastVer === res.prevVer) lastVer = res.ver;
}

function currentReason(id) {
  const row = state.rows.find(r => r.id === id);
  if (row) return row.reason || '';
  return state.detailData && state.detailData.id === id ? state.detailData.reason || '' : '';
}

function setRowReason(id, v) {
  const row = state.rows.find(r => r.id === id);
  if (row) row.reason = v;
  if (state.detailData && state.detailData.id === id) state.detailData.reason = v;
  const arr = splitMulti(v);
  $$('button[data-ms="reason"]').forEach(b => { if (b.dataset.id === id) { b.innerHTML = msInner(arr, '— ยังไม่ระบุ —', b.classList.contains('big')); b.title = reasonTip(arr); b.style.setProperty('--lv', lvVar(worstLv(arr))); } });
}

/** บันทึกสาเหตุ (หลายรายการ) อัปเดตหน้าจอทันที แล้วบันทึกเบื้องหลัง */
function saveReason(id, arr) {
  const next = arr.join(', '), prev = currentReason(id);
  if (next === splitMulti(prev).join(', ')) return;
  setRowReason(id, next);
  sigs.delete(state.view);
  enqueue(id, async () => {
    try {
      const res = await call('updateRequest', [id, { reason: next }, rnOf(id)], true);
      noteVer(res);
      memo.clear();
      toast('อัปเดตสาเหตุแล้ว');
      if (state.detail === id) renderDrawer(false);
    } catch (e) {
      console.error(e);
      if (currentReason(id) === next) setRowReason(id, prev);
      toast('บันทึกสาเหตุไม่สำเร็จ');
    }
  });
}

function onStatusChange(el) {
  const id = el.dataset.st, next = el.value, prev = currentStatus(id);
  el.blur();   // ปล่อยโฟกัสเพื่อไม่ให้ระบบเช็กข้อมูลใหม่ค้างอยู่
  setRowStatus(id, next);
  sigs.delete(state.view);
  enqueue(id, async () => {
    try {
      const res = await call('updateRequest', [id, { status: next }, rnOf(id)], true);
      noteVer(res);
      memo.clear();
      toast('อัปเดตสถานะแล้ว');
      if (next === 'ไม่ผ่าน') {   // เลือกไม่ผ่านจากตาราง → เปิดฟอร์มให้พิมพ์สาเหตุต่อทันที (ถ้ายังไม่มี)
        const row = state.rows.find(r => r.id === id);
        if (!row || !row.reason) setTimeout(() => openForm(id, 'reason'), 0);
      }
      if (state.detail === id) renderDrawer(false);
    } catch (e) {
      console.error(e);
      if (currentStatus(id) === next) setRowStatus(id, prev);
      toast('บันทึกสถานะไม่สำเร็จ');
    }
  });
}

/* =====================================================================
   10. เพิ่ม / แก้ไข / ลบ
   ===================================================================== */
let formBase = '', closeArmed = 0;
const FORM_FIELDS = ['#f_date', '#f_no', '#f_name', '#f_addr', '#f_phone', '#f_type', '#f_status', '#f_phase', '#f_size', '#f_in', '#f_pole', '#f_route', '#f_note'];
function formSnap() { return JSON.stringify(FORM_FIELDS.map(k => $(k).value)); }

/** ปิดฟอร์ม: ถ้ามีข้อมูลที่ยังไม่บันทึก ต้องกดปิดซ้ำภายใน 4 วินาทีเพื่อทิ้ง */
function closeForm(force) {
  if (!force && formSnap() !== formBase && Date.now() - closeArmed > 4000) {
    closeArmed = Date.now();
    $('#mErr').textContent = 'มีข้อมูลที่ยังไม่บันทึก — กดปิดอีกครั้งเพื่อทิ้งการแก้ไข';
    return;
  }
  closeArmed = 0;
  $('#modal').hidden = true;
}

async function openForm(id, focus) {
  if (!state.canWrite) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  let r = null;
  if (id) {
    try { r = await call('getRequest', [id, rnOf(id)]); }
    catch (e) { toast(errMsg(e)); return; }
  }
  editing = r ? r.id : null;
  $('#mTitle').textContent = r ? 'แก้ไขคำร้อง' + (r.no ? ' ' + r.no : '') : 'เพิ่มคำร้อง';
  document.querySelectorAll('#form .invalid').forEach(x => x.classList.remove('invalid'));
  closeArmed = 0;
  $('#mErr').textContent = '';
  $('#f_date').value = r ? r.date : (state.view === 'daily' ? state.day : TODAY);
  $('#f_no').value = r ? r.no : '';
  $('#f_name').value = r ? r.name : '';
  $('#f_addr').value = r ? r.address || '' : '';
  $('#f_phone').value = r ? r.phone || '' : '';
  fillSel('#f_type', ['', ...typeList()], r ? r.type : '');
  fillSel('#f_status', ['', ...STATUS], r && r.status);
  fillSel('#f_phase', ['1P', '3P', '-'], r && r.phase);
  fillSel('#f_in', ['-', 'A', 'B', 'C'], (r && r.inPhase) || '-');
  fillSel('#f_pole', ['-', '8', '9', '12', '12.20', '12.30', '14', '14.30'], r && String(r.pole || '-'));
  $('#f_size').value = r && r.size && r.size !== '-' ? r.size : '';
  $('#f_route').value = r ? r.route || '' : '';
  $('#f_note').value = r ? r.note || '' : '';
  formBase = formSnap();
  $('#modal').hidden = false;
  (focus === 'reason' && r ? $('#f_note') : $('#f_date')).focus();
}

async function submitForm(e) {
  e.preventDefault();
  const date = $('#f_date').value;
  document.querySelectorAll('#form .invalid').forEach(x => x.classList.remove('invalid'));
  const miss = [];
  if (!date) miss.push(['#f_date', 'กรอกวันที่รับคำร้อง']);
  if (!$('#f_no').value.trim()) miss.push(['#f_no', 'กรอกเลขที่คำร้อง']);
  if (!$('#f_type').value) miss.push(['#f_type', 'เลือกประเภทคำร้อง']);
  if (miss.length) {
    miss.forEach(m => $(m[0]).classList.add('invalid'));
    $(miss[0][0]).focus();
    $('#mErr').textContent = miss.map(m => m[1]).join(' และ ');
    return;
  }
  const d = {
    date,
    no: $('#f_no').value.trim(),            // สำนักงานกรอกเอง (ระบบไม่สร้างให้ และเลขที่ต้องไม่ซ้ำ)
    name: $('#f_name').value.trim(),
    address: $('#f_addr').value.trim(),
    phone: $('#f_phone').value.trim(),
    type: $('#f_type').value,
    status: $('#f_status').value,
    phase: $('#f_phase').value,
    size: $('#f_size').value.trim() || '-',
    inPhase: $('#f_in').value,
    pole: $('#f_pole').value,
    route: $('#f_route').value.trim(),
    note: $('#f_note').value.trim()
  };
  const btn = $('#mSave'), wasEditing = !!editing;
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก…';
  $('#mErr').textContent = '';
  try {
    if (wasEditing) {
      if (!d.no) delete d.no;               // ไม่ล้างเลขที่เดิมโดยไม่ตั้งใจ
      const res = await call('updateRequest', [editing, d, rnOf(editing)]);
      noteVer(res);
      if (res && res.id && state.detail === editing) state.detail = res.id;   // เลขที่คำร้องเปลี่ยน = รหัสอ้างอิงเปลี่ยนตาม
    } else {
      d.src = 'บันทึกในเว็บ';
      noteVer(await call('createRequest', [d]));
    }
    closeForm(true);
    toast(wasEditing ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มคำร้องแล้ว');
    reloadAfterChange();
    if (state.detail) loadDetail(state.detail);
  } catch (err) {
    $('#mErr').textContent = errMsg(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'บันทึก';
  }
}

function confirmDelete(btn) {
  const id = btn.dataset.del;
  const r = (state.detailData && state.detailData.id === id ? state.detailData : null) || state.rows.find(x => x.id === id) || {};
  const row = (k, v) => v ? '<div><span>' + k + '</span><b>' + esc(String(v)) + '</b></div>' : '';
  const typ = Array.isArray(r.type) ? r.type.join(', ') : r.type;
  const opener = document.activeElement;
  const box = document.createElement('div');
  box.className = 'cfm';
  box.innerHTML = '<div class="cfm-box" role="alertdialog" aria-modal="true" aria-labelledby="cfmT" aria-describedby="cfmD">'
    + '<div class="cfm-ic" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></div>'
    + '<h3 id="cfmT">ลบคำร้องนี้หรือไม่</h3>'
    + '<p class="cfm-sub" id="cfmD">ตรวจสอบรายการที่จะลบอีกครั้ง</p>'
    + ((r.no || r.name) ? '<div class="cfm-card">' + row('เลขที่', r.no) + row('ผู้ขอ', r.name) + row('ประเภท', typ) + (r.date ? row('วันที่รับ', fmt(r.date)) : '') + '</div>' : '')
    + '<p class="cfm-warn">เมื่อลบแล้วจะไม่สามารถกู้คืนได้</p>'
    + '<div class="cfm-act"><button type="button" class="btn" data-c="no">ยกเลิก</button><button type="button" class="btn danger" data-c="yes"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>ลบคำร้อง</button></div></div>';
  document.body.appendChild(box);
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey, true); if (opener && opener.isConnected) opener.focus(); };
  const onKey = e => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); close(); }
    else if (e.key === 'Tab') {   // ให้โฟกัสวนอยู่ในกล่อง
      const bs = [...box.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
      e.preventDefault();
      bs[(i + (e.shiftKey ? bs.length - 1 : 1)) % bs.length].focus();
    }
  };
  document.addEventListener('keydown', onKey, true);
  box.addEventListener('click', e => {
    if (e.target === box || e.target.closest('[data-c="no"]')) { close(); return; }
    if (e.target.closest('[data-c="yes"]')) { box.remove(); document.removeEventListener('keydown', onKey, true); deleteRequest(id, btn); }
  });
  box.querySelector('[data-c="no"]').focus();
}

/** ลบออกจากหน้าจอทันที ถ้าบันทึกไม่สำเร็จจะใส่กลับ */
async function deleteRequest(id, btn) {
  const idx = state.rows.findIndex(r => r.id === id);
  const removed = idx >= 0 ? state.rows[idx] : null;
  btn.disabled = true;
  if (removed) {
    state.rows.splice(idx, 1);
    state.total = Math.max(0, state.total - 1);
    if (state.view === 'daily' && !isDone(removed)) state.openCount = Math.max(0, state.openCount - 1);
    renderList();
  }
  closeDrawer();
  try {
    await call('deleteRequest', [id]);
    toast('ลบคำร้องแล้ว');
    reloadAfterChange();
  } catch (e) {
    toast(errMsg(e));
    if (removed) {
      state.rows.splice(idx, 0, removed);
      state.total += 1;
      if (state.view === 'daily' && !isDone(removed)) state.openCount += 1;
      renderList();
    }
  }
}

/* =====================================================================
   11. ตัวจัดการเหตุการณ์ (ผูกครั้งเดียวที่ document ไม่ผูกซ้ำทุกครั้งที่วาดตาราง)
   ===================================================================== */
function shiftDay(n) {
  const d = pkey(state.day);
  d.setDate(d.getDate() + n);
  setDay(dkey(d));
}

function setDay(k) {
  state.day = k;
  state.page = 0;
  renderDailyHead();
  loadView();
}

document.addEventListener('click', e => {
  const t = e.target;
  let el;
  const msEl = t.closest('[data-ms]');
  if (pop) {
    const pb = t.closest('#mpop [data-pop]');
    if (pb) { onPopClick(pb); return; }
    if (t.closest('#mpop')) return;
    const same = msEl && msEl === pop.anchor;   // คลิกปุ่มเดิมซ้ำ = ปิด
    closePop(true);                              // คลิกที่อื่น = ยืนยันที่ติ๊กไว้
    if (same) return;
  }
  if (msEl) { openMs(msEl); return; }
  if ((el = t.closest('[data-retry]'))) { loadView({ force: true }); return; }
  if ((el = t.closest('[data-copy]'))) { copyText(el.dataset.copy); return; }
  if ((el = t.closest('[data-edit]'))) { openForm(el.dataset.edit); return; }
  if ((el = t.closest('[data-del]'))) { confirmDelete(el); return; }
  if ((el = t.closest('[data-pgto]'))) {
    const to = Number(el.dataset.pgto);
    if (!el.disabled && to >= 0 && to < state.pages && to !== state.page) { state.page = to; loadView(); }
    return;
  }
  if ((el = t.closest('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'prev') shiftDay(-1); else if (a === 'next') shiftDay(1); else setDay(TODAY);
    return;
  }
  if ((el = t.closest('#treeTog'))) {
    const k = $('#bookKids'), c = k.classList.toggle('collapsed');
    el.setAttribute('aria-expanded', String(!c));
    return;
  }
  if ((el = t.closest('[data-by]'))) { state.by = el.dataset.by; state.bm = 'auto'; state.bd = ''; state.page = 0; loadView(); return; }
  if ((el = t.closest('[data-bm]'))) { state.bm = el.dataset.bm; state.bd = ''; state.page = 0; loadView(); return; }
  if ((el = t.closest('[data-month]'))) { state.month = el.dataset.month; loadView(); return; }
  if ((el = t.closest('[data-y]'))) { state.year = el.dataset.y; state.month = ''; loadView(); return; }
  if ((el = t.closest('[data-day]'))) { state.day = el.dataset.day; location.hash = 'daily'; return; }
  if (t.closest('.dback, [data-close]')) { closeDrawer(); return; }
  if ((el = t.closest('[data-row]')) && !t.closest('button, select, input, a')) openDetail(el.dataset.row);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-st]')) { onStatusChange(t); return; }
  if (t.closest('#mpop')) { onPopChange(t); return; }
  switch (t.id) {
    case 'selMonth': state.month = t.value; loadView(); break;
    case 'selYear':  state.year = t.value; state.fm = ''; state.page = 0; loadView(); break;
    case 'fm': state.fm = t.value; state.page = 0; loadView(); break;
    case 'ft': state.ft = t.value; state.page = 0; loadView(); break;
    case 'fs': state.fs = t.value; state.page = 0; loadView(); break;
    case 'bs': state.bs = t.value; state.page = 0; loadView(); break;
    case 'bd':
      if (!/^\d{4}-\d{2}$/.test(state.bm)) break;
      state.bd = t.value ? state.bm + '-' + t.value : '';   // วันที่ของเดือนที่เลือกอยู่
      state.page = 0; loadView(); break;
    case 'pickDay': if (t.value) setDay(t.value); break;
  }
});

document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'fq') state.q = e.target.value;
  else if (id === 'dq') state.dq = e.target.value;
  else if (id === 'bq') state.bq = e.target.value;
  else return;
  state.page = 0;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTimer = null; loadView(); }, SEARCH_DELAY);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.card[data-row]')) { openDetail(e.target.dataset.row); return; }
  if (e.key !== 'Escape') return;
  if (pop) { closePop(false, true); return; }
  if (!$('#modal').hidden) closeForm(); else closeDrawer();
});

$('#form').addEventListener('submit', submitForm);
$('#btnAdd').addEventListener('click', () => openForm(null));
$('#mCancel').addEventListener('click', () => closeForm());
$('#mClose').addEventListener('click', () => closeForm());
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeForm(); });
$('#form').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#mSave').click(); } });
['input', 'change'].forEach(ev => $('#form').addEventListener(ev, e => {
  if (e.target.classList) e.target.classList.remove('invalid');
}));

$('#btnRefresh').addEventListener('click', async () => {
  const b = $('#btnRefresh');
  b.disabled = true;
  try {
    await call('refreshData', []);       // เติม ID ให้แถวที่พิมพ์เองในชีต + ล้างแคชฝั่งเซิร์ฟเวอร์
    await reloadAfterChange();
    toast('โหลดข้อมูลล่าสุดแล้ว');
  } catch (err) { toast(errMsg(err)); }
  finally { b.disabled = false; }
});

/* โหลดข้อมูลล่าสุดเงียบ ๆ เป็นระยะ เพื่อให้เห็นงานที่เจ้าหน้าที่คนอื่นเพิ่ม/แก้ (ข้ามถ้ากำลังกรอกฟอร์มหรือเลือกรายการอยู่) */
function canAutoRefresh() {
  const a = document.activeElement;
  return authed && started && !document.hidden && !busy && !statusQueues.size && !searchTimer
    && $('#modal').hidden && !pop && !(a && a.tagName === 'SELECT');
}
setInterval(() => { if (canAutoRefresh()) { loadOptions(); loadView({ silent: true, force: true }); } }, AUTO_REFRESH_MS);

/* ถามเซิร์ฟเวอร์เป็นระยะว่าข้อมูลเปลี่ยนไหม (เช่น มีคนพิมพ์ในชีต) ถ้าเปลี่ยนก็โหลดรายการใหม่ทันที */
let lastVer = null, polling = false;
async function pollVersion() {
  if (polling || !canAutoRefresh()) return;
  polling = true;
  try {
    const v = await gas('getVersion');
    if (lastVer === null) lastVer = v;
    else if (v !== lastVer) { lastVer = v; memo.clear(); await loadView({ silent: true, force: true }); }
  } catch (e) { /* เงียบไว้ ลองใหม่รอบหน้า */ }
  finally { polling = false; }
}
let lastActive = Date.now();
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
(function schedulePoll() {
  const idle = Date.now() - lastActive > 300000;
  setTimeout(async () => { await pollVersion(); schedulePoll(); }, idle ? POLL_IDLE_MS : POLL_MS);
})();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  pollVersion();   // กลับมาที่แท็บนี้ → เช็กทันที ไม่ต้องรอรอบถัดไป
  if (canAutoRefresh() && Date.now() - lastLoad > 30000) loadView({ silent: true, force: true });
});
window.addEventListener('focus', () => { lastActive = Date.now(); pollVersion(); });

/* =====================================================================
   12. เข้าสู่ระบบ / เปลี่ยนหน้า / เริ่มทำงาน
   ===================================================================== */
function route() {
  let h = location.hash.replace('#', '');
  if (h === 'all') h = 'book';   // ลิงก์เดิมของ "คำร้องทั้งหมด" ไปที่สมุดแบบทุกปี
  let by = '';
  const ym = /^book-(\d{4})$/.exec(h);
  if (ym) { by = String(+ym[1] - 543); h = 'book'; }   // #book-2569 = สมุดของปี พ.ศ. 2569
  else if (h === 'book') by = 'all';                    // #book = รวมทุกปี
  state.view = ['dashboard', 'daily', 'book'].includes(h) ? h : 'dashboard';
  if (state.view === 'book' && state.by !== by) { state.by = by; state.bm = 'auto'; state.bd = ''; }
  buildFrame();
  loadView();
}
window.addEventListener('hashchange', () => { if (authed && started) route(); });

function showGate() {
  $('#login').hidden = authed;
  $('.shell').hidden = !authed;
}

const ROLE_TH = { admin: 'ผู้ดูแลระบบ', editor: 'เจ้าหน้าที่ (แก้ไขได้)', viewer: 'ดูข้อมูลอย่างเดียว' };

function showDenied(msg) {
  authed = false;
  $('#gateMsg').textContent = msg;
  $('#btnRetry').hidden = false;
  showGate();
}

/** ถามเซิร์ฟเวอร์ว่าผู้ใช้คือใครและมีสิทธิ์อะไร (การป้องกันจริงอยู่ที่เซิร์ฟเวอร์ ปุ่มที่ซ่อนเป็นแค่ความสะดวก) */
async function checkAccess() {
  $('#btnRetry').hidden = true;
  if (!tokenOk()) {
    try { const s = sessionStorage.getItem('idt'), p = s && parseJwt(s); if (p && p.exp * 1000 - Date.now() > 60000) { idToken = s; tokenExp = p.exp * 1000; } } catch (e) { /* ไม่เป็นไร */ }
  }
  if (!tokenOk()) { renderLoginButton(); return; }
  $('#gWrap').hidden = true;
  $('#gateMsg').textContent = 'กำลังตรวจสอบสิทธิ์ผู้ใช้…';
  try {
    const me = await gas('getMe');
    state.me = me;
    state.canWrite = !!me.canWrite;
    state.canDelete = !!me.canDelete;
    ['s'].forEach(k => {
      $('#' + k + 'Name').textContent = me.email || me.name;
      $('#' + k + 'Role').textContent = ROLE_TH[me.role] || me.role;
      $('#' + k + 'Av').hidden = true;
      $('#' + k + 'Who').hidden = false;
    });
    await loadOptions();
    authed = true;
    showGate();
    if (!started) { started = true; route(); }
  } catch (e) {
    if (e && e.message === NEED_LOGIN) { idToken = ''; renderLoginButton(); return; }
    showDenied(errMsg(e));
  }
}
$('#btnRetry').addEventListener('click', checkAccess);
$('#btnLogout').addEventListener('click', () => {
  try { sessionStorage.removeItem('idt'); } catch (e) { /* ไม่เป็นไร */ }
  try { window.google && google.accounts.id.disableAutoSelect(); } catch (e) { /* ไม่เป็นไร */ }
  location.reload();
});

showGate();
initGoogle();
checkAccess();
</script>
