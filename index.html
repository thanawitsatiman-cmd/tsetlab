<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>สมุดคุมคำร้อง</title>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.initGoogle && window.initGoogle()"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">

<style>
/* =====================================================================
   1. ธีมและตัวแปรสี
   ===================================================================== */
:root {
  color-scheme: light;
  --bg: #f5f3f7; --surface: #ffffff; --surface2: #efecf3; --line: #ded9e6; --ink: #211a2a; --muted: #6a6277;
  --accent: #6a2c91; --accent-ink: #ffffff; --accent-soft: #ece2f4;
  --c1: #6a2c91; --c2: #0f8b8d; --c3: #d98a1c; --c4: #2f6fd0; --c5: #c2487a; --c6: #8a8496;
  --good: #1f8a4c; --good-soft: #dff3e6; --warn: #a96a00; --warn-soft: #fbefd2; --bad: #b3261e; --bad-soft: #fbe0de;
  --font: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #17121d; --surface: #211a2a; --surface2: #2b2336; --line: #3a3047; --ink: #f0ecf5; --muted: #a99fb8;
    --accent: #b98be0; --accent-ink: #1b1224; --accent-soft: #3a2a4d;
    --c1: #b98be0; --c2: #4fc3c4; --c3: #f0b04d; --c4: #7aa8f0; --c5: #ec7fae; --c6: #9a94a8;
    --good: #5fd08c; --good-soft: #1d3a29; --warn: #f0b04d; --warn-soft: #3d2f12; --bad: #ff8a80; --bad-soft: #3d1c1a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #17121d; --surface: #211a2a; --surface2: #2b2336; --line: #3a3047; --ink: #f0ecf5; --muted: #a99fb8;
  --accent: #b98be0; --accent-ink: #1b1224; --accent-soft: #3a2a4d;
  --c1: #b98be0; --c2: #4fc3c4; --c3: #f0b04d; --c4: #7aa8f0; --c5: #ec7fae; --c6: #9a94a8;
  --good: #5fd08c; --good-soft: #1d3a29; --warn: #f0b04d; --warn-soft: #3d2f12; --bad: #ff8a80; --bad-soft: #3d1c1a;
}

/* =====================================================================
   2. พื้นฐาน
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 14px; line-height: 1.55;
  font-variant-numeric: tabular-nums;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--surface);
}
img { max-width: 100%; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sp { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface2); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.wide { width: 100%; padding: 11px 14px; font-size: 15px; }

.lnk { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 8px; font-weight: 500; border-radius: 5px; }
.lnk:hover { background: var(--accent-soft); }
.lnk.bad { color: var(--bad); }
.lnk.sure { background: var(--bad); color: var(--accent-ink); }

select, input[type=search], input[type=date] {
  border: 1px solid var(--line); background: var(--surface); padding: 7px 10px; border-radius: 7px; min-width: 0;
}

/* แถบโหลดบาง ๆ ที่ขอบบน (แทนหน้า "กำลังโหลด" ทับทั้งหน้า) */
.loadbar {
  position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; z-index: 60;
  overflow: hidden; opacity: 0; transition: opacity .15s; pointer-events: none;
}
.loadbar.on { opacity: 1; }
.loadbar i { display: block; height: 100%; width: 35%; background: var(--accent); animation: loadslide 1.1s ease-in-out infinite; }
@keyframes loadslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 50; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-weight: 500; max-width: 90vw;
}

/* =====================================================================
   3. หน้าเข้าสู่ระบบ
   ===================================================================== */
.mark { width: 38px; height: 38px; border-radius: 10px; background: none; display: block; flex: none; overflow: hidden; }
.mark img { width: 100%; height: 100%; display: block; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.2; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }

.login {
  min-height: 100vh; display: grid; place-items: center;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lcard {
  width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 32px 28px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
}
.lcard .mark { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 8px; }
.lcard h2 { margin: 0; font-size: 21px; line-height: 1.3; }
.lsub { margin: 0; color: var(--muted); }
.lform { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; margin-top: 14px; }
.lform label { font-size: 12.5px; font-weight: 600; }
.lform input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 16px; }
.lerr { min-height: 18px; color: var(--bad); font-size: 12.5px; }
.lnote { margin: 14px 0 0; font-size: 12px; color: var(--muted); line-height: 1.55; }

.who { display: flex; align-items: center; gap: 12px; width: 100%; margin: 22px 0 0; padding: 12px; background: var(--surface2); border-radius: 10px; text-align: left; min-width: 0; }
.who img { width: 44px; height: 44px; border-radius: 50%; flex: none; object-fit: cover; }
.who div { display: flex; flex-direction: column; min-width: 0; }
.who b { overflow-wrap: anywhere; font-weight: 600; }
.who span { font-size: 12.5px; color: var(--muted); }

/* =====================================================================
   4. โครงหน้า: เมนูด้านข้าง + แถบบน + เนื้อหา
   ===================================================================== */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.content { min-width: 0; }

.side {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px;
  padding: max(18px, env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px));
}
.side .brand { padding: 0 6px; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; }
nav a svg { flex: none; }
nav a:hover { background: var(--surface2); color: var(--ink); }
nav a .cnt { margin-left: auto; min-width: 24px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.6; font-variant-numeric: tabular-nums; }
nav a .cnt.zero { background: var(--surface2); color: var(--muted); }
nav a[aria-current="page"] .cnt.zero { background: var(--surface); }
nav .tree { display: flex; flex-direction: column; gap: 2px; }
nav .trow { position: relative; }
nav .trow a { padding-right: 40px; }
nav .tog { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: inherit; opacity: .75; cursor: pointer; display: grid; place-items: center; }
nav .tog[hidden] { display: none; }
nav .tog:hover { background: var(--surface2); opacity: 1; }
nav .tog svg { transition: transform .15s; }
nav .tog[aria-expanded="false"] svg { transform: rotate(-90deg); }
nav .kids { display: flex; flex-direction: column; gap: 2px; margin: 0 0 2px 21px; padding-left: 8px; border-left: 2px solid var(--line); }
nav .kids.collapsed { display: none; }
nav .kids a { padding: 8px 12px; font-size: 14px; font-weight: 500; gap: 8px; }
nav .kids a::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .45; flex: none; }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.side-foot .who { margin: 0; padding: 8px 6px; background: none; }
.side-foot .who img { width: 34px; height: 34px; }
.side-foot .who > div { flex: 1; gap: 8px; }
.who .whoRow { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.who .rolechip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.who .btn { padding: 5px 10px; font-size: 12.5px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.yearsel { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.yearsel select { color: var(--ink); font-weight: 600; }

main {
  max-width: 1240px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* =====================================================================
   5. ส่วนประกอบในหน้า
   ===================================================================== */
.notice { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 9px 14px; margin-bottom: 16px; font-weight: 500; }
.notice .btn { margin-left: auto; }

.head { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.head h2 { margin: 0; font-size: 20px; line-height: 1.25; text-wrap: balance; }
.head .sub { color: var(--muted); font-size: 13px; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl.mb { margin-bottom: 12px; }
.sub { color: var(--muted); font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi .v { font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 2px; }
.kpi .d { font-size: 12.5px; color: var(--muted); }
.kpi.open .v { color: var(--warn); }

.grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel.mb { margin-bottom: 12px; }
.panel h3 { margin: 0 0 2px; font-size: 14.5px; }
.panel .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.scroll { overflow-x: auto; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }

/* กราฟแท่ง */
.chart { min-width: 640px; display: block; width: 100%; height: auto; }
.chart text { font-family: var(--font); fill: var(--muted); font-size: 11px; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .b { fill: var(--c1); }
.chart .b.td { fill: var(--c3); }
.chart .cn { fill: var(--ink); font-size: 10px; }
.chart .hit { fill: transparent; }
.chart g.colx { cursor: pointer; }
.chart g.colx:hover .hit { fill: var(--accent-soft); }

/* รายการแท่งแนวนอน */
.bl { display: grid; grid-template-columns: 104px minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 5px 0; }
.bl-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-t { height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
.bl-t i { display: block; height: 100%; border-radius: 5px; }
.bl-v { text-align: right; color: var(--muted); font-size: 13px; }
.bl-v b { color: var(--ink); font-weight: 600; }
.sec { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 7px; }

/* ตาราง */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface2); position: sticky; top: 0; }
td.n, th.n { text-align: right; }
td.addr { white-space: normal; min-width: 160px; max-width: 220px; }
td.act { white-space: nowrap; text-align: right; }
tbody tr:hover { background: var(--surface2); }
[data-row] { cursor: pointer; }
.tablewrap {
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow-x: auto; overflow-y: visible;
  scrollbar-width: thin; scrollbar-color: var(--muted) var(--surface2);   /* ไม่มีแถบเลื่อนในตาราง ใช้การเลื่อนของหน้าเว็บ เหมือนหน้ารายวัน */
}
/* สมุดคุมคำร้อง: ตารางสูงพอดีจอ เลื่อนขึ้นลงในตาราง ส่วนแนวนอนบีบคอลัมน์ให้พอดี ไม่ต้องเลื่อนซ้ายขวา */
.tablewrap.fit { overflow-x: auto; overflow-y: visible; max-height: none; }   /* ไม่มีแถบเลื่อนในตาราง: เลื่อนทั้งหน้าแทน */
.tablewrap.fit th, .tablewrap.fit td { padding: 8px 8px; }
.tablewrap.fit td.addr { min-width: 130px; max-width: 190px; }
.tablewrap.fit td.why { min-width: 150px; max-width: 215px; }
.tablewrap.fit .st.rs.msb:not(.big) { min-width: 150px; max-width: 210px; }
.tablewrap.fit .st { max-width: 140px; }
.bk-hint { text-align: right; font-size: 12.5px; color: var(--muted); margin: 0 2px 6px; }
.tablewrap::-webkit-scrollbar { height: 12px; width: 12px; }
.tablewrap::-webkit-scrollbar-track { background: var(--surface2); }
.tablewrap::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 6px; border: 2px solid var(--surface2); }
/* สมุดคุมคำร้อง: เลือกปี / เดือน */
.bk-years { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.ychip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 18px; cursor: pointer; font-weight: 600; }
.ychip:hover { border-color: var(--accent); }
.ychip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bk-years .bk-legend { margin-left: auto; align-self: center; color: var(--muted); font-size: 12.5px; }
.bk-months { display: grid; grid-template-columns: minmax(88px, 1.2fr) repeat(12, minmax(0, 1fr)); gap: 6px; margin-bottom: 18px; }
.mtile { text-align: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.mtile:hover { border-color: var(--accent); }
.mtile .m { font-size: 13px; color: var(--ink); font-weight: 700; }
.mtile .c { font-size: 20px; font-weight: 700; line-height: 1.2; }
.mtile .o { font-size: 11.5px; line-height: 1.3; min-height: 1.3em; color: var(--warn); font-weight: 600; }
.mtile .o.ok { color: var(--good); }
.mtile.zero { background: var(--surface2); }
.mtile.zero .m, .mtile.zero .c { color: var(--muted); opacity: .6; font-weight: 600; }
.mtile.all { background: var(--surface2); margin-right: 6px; }
.mtile[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); opacity: 1; }
.mtile[aria-pressed="true"] .m, .mtile[aria-pressed="true"] .c, .mtile[aria-pressed="true"] .o { color: var(--accent-ink); opacity: 1; }
@media (max-width: 820px) {
  .bk-months { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .mtile.all { grid-column: 1 / -1; margin-right: 0; flex-direction: row; justify-content: center; gap: 10px; }
  .bk-years .bk-legend { display: none; }
}
.pager { display: flex; align-items: center; gap: 10px 14px; justify-content: space-between; flex-wrap: wrap; padding-top: 10px; color: var(--muted); }
.pager:empty { display: none; }
.pager .pgs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.pager .pg { min-width: 36px; height: 36px; padding: 0 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-weight: 500; font-variant-numeric: tabular-nums; }
.pager .pg:hover:not(:disabled):not([aria-current]) { background: var(--surface2); }
.pager .pg[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: default; }
.pager .pg:disabled { opacity: .45; cursor: default; }
.pager .pgdots { min-width: 22px; text-align: center; color: var(--muted); }
@media (max-width: 560px) { .pager { justify-content: center; } .pager .pgs { margin: 0 auto; justify-content: center; } .pager .pg { min-width: 34px; height: 34px; } }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chips:empty { display: none; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.chip b { font-weight: 700; margin-left: 6px; }

/* สถานะ */
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; }
.st { border: 0; border-radius: 999px; padding: 2px 6px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; max-width: 150px; }
.st.big { font-size: 14px; padding: 6px 12px; max-width: 100%; }
.st option { background: var(--surface); color: var(--ink); }
.pill.done, .st.done { background: var(--good-soft); color: var(--good); }
.pill.wait, .st.wait { background: var(--warn-soft); color: var(--warn); }
.pill.prog, .st.prog { background: var(--accent-soft); color: var(--accent); }
.pill.fail, .st.fail { background: var(--bad-soft); color: var(--bad); }
.st.rs { background: var(--surface2); color: var(--ink); max-width: 300px; border-radius: 7px; padding: 4px 8px; border: 1px solid var(--line); }
.st.rs.big { max-width: 100%; }
td.why { font-size: 13px; max-width: 270px; min-width: 170px; white-space: normal; line-height: 1.4; word-break: break-word; }
.tg { display: block; white-space: nowrap; }

/* สีระดับความเสี่ยง แดง → เขียว */
:root { --lv0: #9a93a6; --lv1: #d93025; --lv2: #f07a1a; --lv3: #e6a700; --lv4: #78b43e; --lv5: #1e9e4f; }
.rls { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.rl { display: flex; align-items: flex-start; gap: 8px; line-height: 1.35; font-size: 13px; color: var(--ink); }
.rl span { min-width: 0; overflow-wrap: anywhere; }
/* สาเหตุที่แสดงเป็นบรรทัด (ลิ้นชัก/ผู้ดูอย่างเดียว): ทั้งป้ายเป็นสีตามระดับ */

/* หน้าตาเหมือนกล่อง "ทุกสถานะ" (select) */

}

}

  display: flex; flex-direction: column; max-height: calc(100vh - 4vh - 32px); max-height: calc(100dvh - 4vh - 32px); overflow: hidden; }

/* ช่องติ๊กสาเหตุ: ทั้งป้ายเป็นสีตามระดับ (ยังไม่ติ๊ก = สีอ่อน, ติ๊กแล้ว = สีเข้มขึ้น) */

/* =====================================================================
   ปรับหน้าตาให้สบายตา: สีนุ่มลง ตัวอักษรโตขึ้น เว้นระยะมากขึ้น มุมโค้งและเงาบาง ๆ
   ===================================================================== */
:root {
  --bg: #f8f6fb; --surface2: #f4f1f8; --line: #e8e3ef; --ink: #2b2436; --muted: #70697f; --accent-soft: #f2eaf9;
  --shadow: 0 1px 2px rgba(43, 30, 64, .05), 0 6px 18px rgba(43, 30, 64, .04);
}
body { font-size: 15px; line-height: 1.65; }
.shell { grid-template-columns: 268px minmax(0, 1fr); }
.side { gap: 26px; }
.brand h1 { font-size: 16.5px; font-weight: 600; }
nav { gap: 4px; }
nav a { padding: 11px 14px; border-radius: 12px; font-weight: 500; }
nav a[aria-current="page"] { font-weight: 600; }
nav .trow a { padding-right: 44px; white-space: nowrap; }
nav .kids a { font-size: 14px; padding: 9px 12px; border-radius: 10px; }
nav .kids { margin-left: 24px; border-left-width: 1px; }
nav a .cnt { font-size: 12.5px; padding: 0 9px; }
.side-foot .who b { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.side-foot .who .rolechip { font-size: 12px; }

.bar { box-shadow: none; }
main { padding-top: 26px; }
.head { margin-bottom: 18px; }
.head h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.head .sub, .sub { font-size: 13.5px; }

.panel, .kpi { border-radius: 14px; border-color: var(--line); box-shadow: var(--shadow); }
.panel { padding: 20px; }
.kpi { padding: 16px 18px; }
.kpi .v { font-weight: 600; }

.btn, select, input[type=search], input[type=date] { border-radius: 10px; border-color: var(--line); min-height: 38px; }
.btn { padding: 8px 14px; }

th, td { padding: 13px 14px; border-bottom-color: var(--line); }
th { font-size: 12.5px; font-weight: 500; background: var(--surface2); letter-spacing: .01em; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }

.mtile { border-radius: 14px; border-color: var(--line); box-shadow: var(--shadow); padding: 9px 4px 8px; }
.mtile .m { font-weight: 600; font-size: 13px; }
.mtile .c { font-weight: 600; }
.mtile.zero { background: transparent; box-shadow: none; border-style: dashed; }
.mtile.zero .m, .mtile.zero .c { opacity: .5; }
.mtile.all { background: var(--accent-soft); border-color: transparent; }
.mtile[aria-pressed="true"] { box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent); }
.bk-years .bk-legend { font-size: 13px; }

.st { padding: 4px 10px; font-size: 13px; }
.st.rs { border-radius: 10px; padding: 6px 10px; }
.pager .pg { border-radius: 10px; }
.btn.pri:hover { background: var(--accent); color: var(--accent-ink); }

/* สถานะตอนเอาเมาส์ชี้ ให้อ่านออกเสมอ: ปุ่ม/เมนูที่เลือกอยู่ไม่เปลี่ยนสี, กราฟมีแถบจาง ๆ ตามแท่งที่ชี้ */
nav a[aria-current="page"]:hover { background: var(--accent-soft); color: var(--accent); }
.chart g.colx:hover .hit { fill: color-mix(in srgb, var(--accent) 9%, transparent); }
.mtile[aria-pressed="true"]:hover, .ychip[aria-pressed="true"]:hover { background: var(--accent); color: var(--accent-ink); }
.lnk:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* ปุ่มเดือน: เส้นทึบบาง ๆ เดือนที่ไม่มีข้อมูลจางลง ตอนชี้ขึ้นพื้นม่วงอ่อน ไม่ใช้เส้นประ */
.mtile { border: 1px solid var(--line); box-shadow: none; background: var(--surface); transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; }
.mtile:hover { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); transform: translateY(-1px); }
.mtile.zero { background: color-mix(in srgb, var(--surface2) 55%, transparent); border-style: solid; border-color: transparent; }
.mtile.zero .m, .mtile.zero .c { opacity: .55; }
.mtile.zero:hover { background: var(--surface2); border-color: var(--line); transform: none; }
.mtile.all { background: var(--accent-soft); border-color: transparent; }
.mtile.all:hover { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.mtile[aria-pressed="true"], .mtile[aria-pressed="true"]:hover { background: var(--accent); border-color: var(--accent); transform: none; box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 28%, transparent); }
.mtile .o { font-weight: 500; }

/* กล่องยืนยันการลบ */
.cfm { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(24, 14, 34, .55); backdrop-filter: blur(3px); animation: cfmFade .15s ease-out; }
.cfm-box { width: min(400px, 100%); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); padding: 28px 24px 22px; text-align: center; animation: cfmPop .18s ease-out; }
.cfm-ic { width: 56px; height: 56px; margin: 4px auto 18px; border-radius: 50%; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad-soft) 45%, transparent); }
.cfm-box h3 { margin: 0; font-size: 19px; font-weight: 600; }
.cfm-sub { margin: 6px 0 0; color: var(--muted); }
.cfm-card { margin: 18px 0 0; padding: 4px 16px; background: var(--surface2); border-radius: 12px; text-align: left; }
.cfm-card div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; font-size: 14px; }
.cfm-card div + div { border-top: 1px solid var(--line); }
.cfm-card span { color: var(--muted); flex: none; }
.cfm-card b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.cfm-warn { margin: 14px 0 0; font-size: 13px; color: var(--bad); }
.cfm-act { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.cfm-act .btn { min-height: 44px; border-radius: 12px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
.btn.danger:hover { background: var(--bad); filter: brightness(1.1); }
@keyframes cfmFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes cfmPop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cfm, .cfm-box { animation: none; } }

/* =====================================================================
   หน้าจอโทรศัพท์: ตารางเปลี่ยนเป็นการ์ดต่อคำร้อง, ปุ่ม/ช่องกรอกใหญ่พอให้แตะ, ไม่ต้องเลื่อนซ้ายขวา
   ===================================================================== */

  main { padding-block: 14px 36px; }

  select, input[type=search], input[type=date], .btn, .msf { min-height: 44px; font-size: 16px; }

  /* แถบเครื่องมือค้นหา: ช่องค้นหาเต็มแถว ตัวกรองแบ่งสองคอลัมน์ */
  .ctl.mb { gap: 8px; }

  .bk-months { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .mtile { padding: 9px 4px 8px; min-height: 64px; }
  .mtile .m { font-size: 14px; }
  .bk-hint { text-align: left; }

  /* ตาราง → การ์ด */
  .tablewrap, .tablewrap.fit { border: 0; background: none; border-radius: 0; overflow: visible; }
  .tablewrap table, .tablewrap thead, .tablewrap tbody { display: block; width: 100%; }
  .tablewrap thead { display: none; }
  .tablewrap tbody tr {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .tablewrap tbody tr:hover { background: var(--surface); }
  .tablewrap tbody tr:active { background: var(--surface2); }
  .tablewrap td, .tablewrap.fit td {

    text-align: left; overflow-wrap: anywhere; font-size: 14px;
  }
  .tablewrap td::before {
    content: attr(data-label); display: block; font-size: 11.5px; line-height: 1.3; color: var(--muted); font-weight: 600; margin-bottom: 1px;
  }
  /* ผู้ขอ = หัวการ์ด */
  .tablewrap td:nth-child(3) { grid-column: 1 / -1; font-size: 16px; font-weight: 700; order: -1; }
  .tablewrap td:nth-child(3)::before { display: none; }
  /* วันที่ + เลขที่ อยู่บรรทัดบน */
  .tablewrap td:nth-child(1), .tablewrap td:nth-child(2) { order: -2; }
  .tablewrap td:nth-child(2) { text-align: right; }
  .tablewrap td:nth-child(2)::before { text-align: right; }
  /* ช่องยาวเต็มแถว */
  .tablewrap td:nth-child(4), .tablewrap td:nth-child(5),
  .tablewrap td:nth-child(8), .tablewrap td:nth-child(9) { grid-column: 1 / -1; }
  /* สถานะ / สาเหตุ ปุ่มเต็มความกว้าง */
  .tablewrap td .st, .tablewrap td .st.rs, .tablewrap td .st.rs.msb:not(.big), .tablewrap.fit .st, .tablewrap.fit .st.rs.msb:not(.big) {

  .tablewrap td.why .msb { justify-content: space-between; }
  .tg { white-space: normal; }

  /* หน้าสรุป (ตารางสรุปรายเดือน) ยังเลื่อนซ้ายขวาในกรอบของมันเอง */
  .scroll table { display: table; }

  /* ตัวเลือกหลายรายการและลิ้นชักรายละเอียด: ปุ่มปิด/แถวตัวเลือกใหญ่ขึ้น */
  .dx { width: 44px; height: 44px; }

  .pager { gap: 8px; }

  .toast { max-width: calc(100vw - 32px); text-align: center; }
}
@media (max-width: 380px) {

}

/* ----- เข้าสู่ระบบด้วย Google (ID token อายุ ~1 ชม. ต่ออายุอัตโนมัติเมื่อใกล้หมด) ----- */
let idToken = '', tokenExp = 0, tokenWaiters = [], gisReady = false, wantBtn = false;

function parseJwt(t) {
  try {
    const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p), c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
const tokenOk = () => !!idToken && tokenExp - Date.now() > 60000;

function onCredential(resp) {
  const p = resp && resp.credential ? parseJwt(resp.credential) : null;
  if (!p) return;
  idToken = resp.credential; tokenExp = p.exp * 1000;
  try { sessionStorage.setItem('idt', idToken); } catch (e) { /* ไม่เป็นไร */ }
  const ws = tokenWaiters; tokenWaiters = [];
  ws.forEach(f => f(idToken));
  if (!authed) checkAccess();
}

function initGoogle() {
  if (gisReady || !(window.google && google.accounts && google.accounts.id)) return;
  gisReady = true;
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false });
  if (wantBtn) renderLoginButton();
}
window.initGoogle = initGoogle;

function renderLoginButton() {
  wantBtn = true;
  $('#gateMsg').textContent = 'กรุณาเข้าสู่ระบบด้วยบัญชี Google เพื่อใช้งาน';

  google.accounts.id.renderButton($('#gBtn'), { theme: 'outline', size: 'large', locale: 'th', text: 'signin_with' });
  google.accounts.id.prompt();
}

function ensureToken() {
  if (tokenOk()) return Promise.resolve(idToken);
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error(NEED_LOGIN)), 10000);
    tokenWaiters.push(tk => { clearTimeout(t); resolve(tk); });
    try { google.accounts.id.prompt(); } catch (e) { clearTimeout(t); reject(new Error(NEED_LOGIN)); }
  });
}

/** เรียกฟังก์ชันใน Apps Script ผ่าน fetch (ใช้ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight ที่ Apps Script ไม่รองรับ) */
async function gas(name, ...args) {
  const token = await ensureToken();
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: name, args: args, token: token })
    });
  } catch (e) {
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือ API_URL / การ Deploy (ต้องเป็น Anyone)');
  }
  let j;
  try { j = await res.json(); }
  catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ ตรวจสอบ API_URL และการ Deploy ว่าเป็น Who has access = Anyone'); }
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

let busy = 0;
function setBusy(delta) {
  busy = Math.max(0, busy + delta);
  $('#loadbar').classList.toggle('on', busy > 0);
}

/** quiet = true จะไม่แสดงแถบโหลด (ใช้ตอนเปลี่ยนสถานะ) */
async function call(name, args, quiet) {
  if (!quiet) setBusy(1);
  try { return await gas(name, ...args); }
  finally { if (!quiet) setBusy(-1); }
}

const memo = new Map();     // key -> { t, data }  ผลที่โหลดมาแล้ว ใช้แสดงทันทีเมื่อกลับมาหน้าเดิม

let lastLoad = 0;

function requestFor(view) {
  if (view === 'dashboard') {
    return { key: 'd|' + state.year + '|' + state.month, name: 'getDashboardData', args: [state.year, state.month] };
  }
  if (view === 'daily') {
    const p = { date: state.day, page: state.page, pageSize: DAILY_PAGE_SIZE, q: state.dq.trim() };
    return { key: 'y|' + JSON.stringify(p), name: 'getRequestsPage', args: [p] };
  }
  if (view === 'book') {
    const b = { year: state.by, month: state.bm, date: state.bd, page: state.page, pageSize: BOOK_VISIBLE_ROWS, type: state.bt, reason: state.br, status: state.bs, q: state.bq.trim() };
    return { key: 'b|' + JSON.stringify(b), name: 'getBookData', args: [b] };
  }
  const p = { page: state.page, pageSize: PAGE_SIZE, year: state.year, month: state.fm, type: state.ft, status: state.fs, q: state.q.trim() };
  return { key: 'a|' + JSON.stringify(p), name: 'getRequestsPage', args: [p] };
}

/**
 * โหลดข้อมูลของหน้าปัจจุบัน
 *  - เจอข้อมูลที่เคยโหลดไว้ → แสดงทันที แล้วค่อยโหลดใหม่เงียบ ๆ ถ้าเก่าเกิน FRESH_MS
 *  - ระหว่างโหลดตารางเดิมยังอยู่ มีแค่แถบบาง ๆ ที่ขอบบน
 *  - silent = ไม่ขึ้นแถบโหลด, force = โหลดใหม่เสมอ
 */
async function loadView({ silent = false, force = false } = {}) {
  const view = state.view, my = ++seq, req = requestFor(view);
  const hit = memo.get(req.key);
  if (hit && !force) {
    showData(view, hit.data);
    if (Date.now() - hit.t < FRESH_MS) return;
  }
  if (!silent) setBusy(1);
  try {
    let data;
    try { data = await gas(req.name, ...req.args); }
    catch (e) { await sleep(500); data = await gas(req.name, ...req.args); }   // ลองซ้ำ 1 ครั้ง
    memo.set(req.key, { t: Date.now(), data });
    lastLoad = Date.now();
    if (!(view === 'daily' && state.day === TODAY && !state.dq.trim())) refreshToday(force);
    if (my !== seq || state.view !== view) return;
    setNotice('');
    showData(view, data);
  } catch (e) {
    if (my !== seq || state.view !== view) return;
    setNotice(errMsg(e), true);
    if (!state.rows.length && !state.summary) clearPlaceholder(view);
  } finally {
    if (!silent) setBusy(-1);
  }
}

/** ตัวเลขข้างเมนู "คำร้องวันนี้" = จำนวนคำร้องที่ลงวันที่วันนี้ */
let todayT = 0, todayBusy = false;
function setTodayCount(n) {
  const el = $('#cntToday');
  if (!el || typeof n !== 'number') return;
  el.textContent = n.toLocaleString('th-TH');
  el.classList.toggle('zero', n === 0);
  el.title = 'วันนี้มี ' + n + ' รายการ';
  el.hidden = false;
  todayT = Date.now();
}
async function refreshToday(force) {
  if (todayBusy || (!force && Date.now() - todayT < FRESH_MS)) return;
  todayBusy = true;
  try {
    const r = await gas('getRequestsPage', { date: TODAY, page: 0, pageSize: 1 });
    if (r && typeof r.total === 'number') setTodayCount(r.total);
  } catch (e) { /* เงียบไว้ รอบหน้าลองใหม่ */ }
  finally { todayBusy = false; }
}

function showData(view, data) {
  if (view === 'daily' && state.day === TODAY && !state.dq.trim() && data && typeof data.total === 'number') setTodayCount(data.total);
  const sig = JSON.stringify(data);
  if (sigs.get(view) === sig) return;
  sigs.set(view, sig);
  if (data.years) state.years = data.years;
  updateYearSelector();
  if (view === 'book') {
    const pg = data.page;
    state.by = data.year; state.bm = data.month; state.bookMonths = data.months || [];
    syncNav();
    state.rows = pg.rows; state.total = pg.total; state.pages = pg.pages; state.page = pg.page;
    state.openCount = pg.openCount || 0; state.types = pg.types || []; state.reasons = pg.reasons || [];
    renderList();
    return;
  }
  if (view === 'dashboard') {
    state.summary = data;
    state.month = data.month;
    renderDashboard();
    return;
  }
  state.rows = data.rows;
  state.total = data.total;
  state.pages = data.pages;
  state.page = data.page;
  state.openCount = data.openCount || 0;
  state.typeCounts = data.typeCounts || {};
  state.types = data.types || [];
  state.months = data.months || [];
  renderList();
}

function clearPlaceholder(view) {
  if (view === 'dashboard') $('#view').innerHTML = '<div class="panel empty">โหลดข้อมูลไม่สำเร็จ</div>';

let optSig = '';
/** อ่านรายการตัวเลือกประเภท/สาเหตุจาก dropdown ในชีต (เปลี่ยนเมื่อไหร่ก็วาดหน้าใหม่) */
async function loadOptions() {
  try {
    const o = await gas('getOptions');
    const sig = JSON.stringify(o || {});
    if (sig === optSig) return;
    optSig = sig;
    state.typeOpts = (o && o.types) || [];
    state.reasonOpts = (o && o.reasons) || [];
    if (started) {
      sigs.clear();
      if (state.view === 'dashboard') renderDashboard(); else { renderList(); renderBookFilters(); }
    }
  } catch (e) { console.error('getOptions', e); }
}

function reloadAfterChange() {
  loadOptions();
  memo.clear();
  sigs.clear();
  return loadView({ force: true });
}

   4. ข้อความแจ้งเตือน / Toast
   ===================================================================== */
function setNotice(msg, retry) {
  $('#notice').innerHTML = msg
    ? '<div class="notice"><span>โหลดข้อมูลไม่สำเร็จ: ' + esc(msg) + '</span>' + (retry ? '<button class="btn" type="button" data-retry="1">ลองใหม่</button>' : '') + '</div>'
    : '';
}

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

/* =====================================================================
   5. ส่วนประกอบที่ใช้ร่วมกัน (ตัวเลือก, ปุ่มสถานะ, แถวตาราง)
   ===================================================================== */
/** กล่องติ๊กหลายข้อในฟอร์ม (ค่าเก่าที่ไม่อยู่ในรายการ จะแสดงให้ติ๊กต่อได้) */
function fillChecks(id, list, selected, colored) {
  const all = uniq([...list, ...selected]);
  const box = $(id);
  const old = box.previousElementSibling;
  if (old && old.classList.contains('ckq')) old.remove();
  box.classList.toggle('scroll', all.length > 10);
  if (all.length > 10) box.insertAdjacentHTML('beforebegin', '<input type="search" class="ckq" placeholder="พิมพ์ค้นหา..." aria-label="ค้นหาตัวเลือก" autocomplete="off" data-for="' + id + '">');
  box.innerHTML = all.map(x =>
    '<label class="ckb' + (colored ? ' lvc' : '') + '"' + (colored ? ' style="--lv:' + lvVar(reasonLv(x)) + '"' : '') + '><input type="checkbox" value="' + esc(x) + '"' + (selected.includes(x) ? ' checked' : '') + '><span>' + esc(x) + '</span></label>').join('');
}
const getChecks = id => $$(id + ' input:checked').map(i => i.value);

function fillSel(id, arr, cur) {
  const el = $(id);
  el.innerHTML = arr.map(x => '<option value="' + esc(x) + '">' + esc(x === '' ? '— ยังไม่ระบุ —' : x) + '</option>').join('');
  if (cur && !arr.includes(cur)) el.insertAdjacentHTML('beforeend', '<option value="' + esc(cur) + '">' + esc(cur) + '</option>');
  el.value = cur || arr[0] || '';
}

/** ตั้งตัวเลือกของ <select> ใหม่เฉพาะเมื่อรายการเปลี่ยน (ไม่รบกวนตอนผู้ใช้กำลังเลือก) */
function setOptions(sel, items, cur) {
  const list = items.slice();
  if (cur && !list.some(x => x[0] === cur)) list.push([cur, cur]);
  const sig = JSON.stringify(list) + '|' + cur;
  if (sel.dataset.sig === sig) return;
  sel.dataset.sig = sig;
  sel.innerHTML = list.map(x => '<option value="' + esc(x[0]) + '">' + esc(x[1]) + '</option>').join('');
  sel.value = cur;
}

function statusCell(r, big) {
  const cur = normSt(r.status);
  if (!state.canWrite || !r.id) return '<span class="pill ' + statusCls(cur) + '">' + esc(cur || 'รอผลตรวจ') + '</span>';
  const opts = [...new Set(['', ...STATUS, cur])]
    .map(x => '<option value="' + esc(x) + '"' + (x === cur ? ' selected' : '') + '>' + esc(x === '' ? '— รอผลตรวจ —' : x) + '</option>').join('');
  return '<select class="st ' + statusCls(cur) + (big ? ' big' : '') + '" data-st="' + esc(r.id) + '">' + opts + '</select>';
}

/* ----- ประเภท / สาเหตุ เลือกได้หลายรายการ (เก็บในช่องเดียวคั่นด้วยจุลภาค เช่น "รอเซ็น, รอตรวจ") ----- */
/* ตัวเลือกที่มี , อยู่ในชื่อ (เช่น "ใช้สายเมน...,ปลายสายสั้นเกินไป") ต้องไม่ถูกตัดเป็น 2 รายการ */
const commaOpts = () => [...new Set([...REASONS, ...(state.reasonOpts || [])].filter(x => x.indexOf(',') >= 0))].sort((a, b) => b.length - a.length);
const splitMulti = s => {
  let t = REASON_FIX(s);
  if (t.indexOf(',') < 0) return t.trim() ? [t.trim()] : [];
  const keep = [];
  commaOpts().forEach(o => { if (t.indexOf(o) >= 0) { t = t.split(o).join('\u0001' + keep.length + '\u0001'); keep.push(o); } });
  return t.split(',').map(x => x.trim().replace(/\u0001(\d+)\u0001/g, (m, i) => keep[+i])).filter(Boolean);
};
/* ตัดค่าซ้ำ (ไม่สนช่องว่างหัวท้าย/ช่องว่างซ้อน) */
const uniq = a => { const seen = new Set(); return a.map(x => String(x).replace(/\s+/g, ' ').trim()).filter(x => x && !seen.has(x) && seen.add(x)); };
/* รายการตัวเลือก: ใช้ตาม dropdown ในชีต ถ้าอ่านไม่ได้ใช้รายการตั้งต้นในโค้ด */
const typeList = () => uniq(state.typeOpts && state.typeOpts.length ? state.typeOpts : TYPES);
const reasonList = () => uniq((state.reasonOpts && state.reasonOpts.length ? state.reasonOpts : REASONS).map(REASON_FIX));

function typeTags(v) {
  const a = splitMulti(v);
  return a.length
    ? a.map(t => '<span class="tg"><i class="dot" style="background:' + TCOL[typeIdx(t)] + '"></i>' + esc(t) + '</span>').join('')
    : '-';
}

/** เรียงสาเหตุจากรุนแรงสุด (แดง) ไปสำเร็จ (เขียว) ข้อที่ยังไม่จัดระดับอยู่ท้าย */
function sortByLv(arr) {
  const k = x => { const n = reasonLv(x); return n || 9; };
  return arr.map((x, i) => [x, i]).sort((a, b) => k(a[0]) - k(b[0]) || a[1] - b[1]).map(p => p[0]);
}
/** สีแถบด้านซ้ายของช่อง = ระดับที่เสี่ยงที่สุดในที่เลือก */
function worstLv(arr) {
  const ns = arr.map(reasonLv).filter(Boolean);
  return ns.length ? Math.min(...ns) : 0;
}
/** full = true: แสดงทุกข้อเป็นบรรทัด (ใช้ในลิ้นชักรายละเอียด) / false: ช่องเดียวแบบกะทัดรัด = ข้อที่เสี่ยงที่สุด + จำนวนที่เหลือ */
function msInner(arr, placeholder, full) {
  let body;
  if (!arr.length) body = '<span class="ph">' + esc(placeholder) + '</span>';
  else if (full) body = '<span class="rls">' + sortByLv(arr).map(x => '<span class="rl" style="--lv:' + lvVar(reasonLv(x)) + '"><span>' + esc(x) + '</span></span>').join('') + '</span>';
  else {
    const top = sortByLv(arr)[0], more = arr.length - 1;
    body = '<span class="rl one"><span class="t">' + esc(top) + '</span>' + (more ? '<b class="mo">+' + more + '</b>' : '') + '</span>';
  }
  return '<span class="mst">' + body + '</span><span class="car" aria-hidden="true">▾</span>';
}
const reasonTip = arr => arr.length > 1 ? sortByLv(arr).join('\n') : '';

function reasonCell(r, big) {
  const arr = splitMulti(r.reason);
  if (!state.canWrite || !r.id) return arr.length ? '<span class="rls">' + sortByLv(arr).map(x => '<span class="rl" style="--lv:' + lvVar(reasonLv(x)) + '"><span>' + esc(x) + '</span></span>').join('') + '</span>' : '<span style="color:var(--muted)">-</span>';
  return '<button type="button" class="st rs msb' + (big ? ' big' : '') + '" style="--lv:' + lvVar(worstLv(arr) || null) + '" title="' + esc(reasonTip(arr)) + '" data-ms="reason" data-id="' + esc(r.id)
    + '" aria-haspopup="dialog" aria-label="สาเหตุ (เลือกได้หลายข้อ)">' + msInner(arr, '— ยังไม่ระบุ —', big) + '</button>';
}

let pop = null;   // กล่องติ๊กที่เปิดอยู่ { el, anchor, opts, sel, before, apply }

function msSpec(kind, id) {
  if (kind === 'reason') {
    const cur = splitMulti(currentReason(id));
    return { opts: uniq([...reasonList(), ...cur]).map(x => [x, x]), sel: cur, apply: arr => saveReason(id, arr) };
  }
  if (kind === 'bt') {
    return {
      opts: uniq([...typeList(), ...(state.types || []), ...state.bt]).map(x => [x, x]), sel: state.bt.slice(),
      apply: arr => { state.bt = arr; state.page = 0; renderBookFilters(); loadView(); }
    };
  }
  const known = uniq([...reasonList(), ...(state.reasons || []), ...state.br.filter(x => x !== '__none')]);
  return {
    opts: [['__none', 'ยังไม่ระบุสาเหตุ'], ...known.map(x => [x, x])], sel: state.br.slice(),
    apply: arr => { state.br = arr; state.page = 0; renderBookFilters(); loadView(); }
  };
}

function openMs(btn) {
  const spec = msSpec(btn.dataset.ms, btn.dataset.id);
  const sel = new Set(spec.sel);
  const el = document.createElement('div');
  el.id = 'mpop'; el.className = 'mpop';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'เลือกได้หลายรายการ');
  const searchable = spec.opts.length > 8;
  const colored = btn.dataset.ms !== 'bt';
  el.innerHTML = '<div class="mph">'
      + (searchable ? '<input type="search" class="mpq" placeholder="พิมพ์ค้นหา..." aria-label="ค้นหาตัวเลือก" autocomplete="off">' : '')
      + '<div class="mpi"><span class="mpn"></span><button type="button" class="mpt" data-pop="only"></button></div></div>'
    + '<div class="mpl">' + spec.opts.map(o =>
      '<label class="mpo' + (colored ? ' lvc' : '') + '" style="--lv:' + lvVar(colored && o[0] !== '__none' ? reasonLv(o[0]) : 0) + '"><input type="checkbox" value="' + esc(o[0]) + '"' + (sel.has(o[0]) ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>').join('')
    + '<div class="mpe" hidden>ไม่พบรายการที่ค้นหา</div></div>'
    + '<div class="mpf"><span class="cnt"></span><span class="sp"></span><button type="button" class="btn" data-pop="clear">ล้าง</button><button type="button" class="btn pri" data-pop="done">เสร็จ</button></div>';
  document.body.appendChild(el);
  pop = { el, anchor: btn, opts: spec.opts, sel, apply: spec.apply, only: sel.size > 0, keep: new Set(sel), before: spec.opts.filter(o => sel.has(o[0])).map(o => o[0]).join('\n') };
  btn.setAttribute('aria-expanded', 'true');
  updatePopMeta();
  placePop();
  const first = searchable ? el.querySelector('.mpq') : el.querySelector('input');
  if (first) first.focus({ preventScroll: true });
}

/** กรองรายการตามคำค้นและ "เฉพาะที่เลือก" แล้วอัปเดตตัวนับ */
function updatePopMeta() {
  if (!pop) return;
  const q = srchKey((pop.el.querySelector('.mpq') || {}).value || '');
  let shown = 0;
  pop.el.querySelectorAll('.mpo').forEach(l => {
    const inp = l.querySelector('input');
    const ok = (!q || srchKey(l.textContent).indexOf(q) >= 0) && (q || !pop.only || pop.keep.has(inp.value));   // โหมดเฉพาะที่เลือก: ถ้าพิมพ์ค้นหา จะค้นจากทุกรายการ
    l.hidden = !ok;
    if (ok) shown++;
  });
  const empty = pop.el.querySelector('.mpe');
  if (empty) empty.hidden = shown > 0;
  const n = pop.el.querySelector('.mpn');
  if (n) n.textContent = pop.only && !q ? 'แสดงเฉพาะที่เลือก' : 'ทั้งหมด ' + pop.opts.filter(o => o[0] !== '__none').length + ' รายการ';
  const tg = pop.el.querySelector('.mpt');
  if (tg) { tg.hidden = pop.keep.size === 0; tg.textContent = pop.only ? '+ เพิ่ม / เปลี่ยนรายการ' : 'เฉพาะที่เลือก'; }
  placePop();
  const c = pop.el.querySelector('.cnt');
  if (c) c.innerHTML = pop.sel.size ? 'เลือกแล้ว <b>' + pop.sel.size + '</b> รายการ' : 'ยังไม่ได้เลือก';
}

function placePop() {
  if (!pop) return;
  const r = pop.anchor.getBoundingClientRect(), el = pop.el;
  if (window.innerWidth <= 600) { el.style.maxHeight = ''; return; }   // มือถือ: แผ่นล่างจอ จัดด้วย CSS
  const gap = 4, pad = 8;
  const below = window.innerHeight - r.bottom - gap - pad;
  const above = r.top - gap - pad;
  const useBelow = below >= 300 || below >= above;      // พื้นที่ด้านล่างพอ หรือมากกว่าด้านบน
  const room = Math.max(160, useBelow ? below : above);
  el.style.maxHeight = Math.min(540, room) + 'px';
  const w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(pad, Math.min(r.left, window.innerWidth - w - pad));
  const top = useBelow ? r.bottom + gap : r.top - gap - h;
  el.style.left = left + 'px';
  el.style.top = Math.max(pad, top) + 'px';
}

/** apply = true บันทึกที่ติ๊กไว้ (ถ้ามีการเปลี่ยน), false = ยกเลิก */
function closePop(apply, refocus) {
  if (!pop) return;
  const p = pop;
  pop = null;
  p.el.remove();
  p.anchor.removeAttribute('aria-expanded');
  const vals = p.opts.filter(o => p.sel.has(o[0])).map(o => o[0]);
  if (apply && vals.join('\n') !== p.before) p.apply(vals);
  if (refocus && p.anchor.isConnected) p.anchor.focus({ preventScroll: true });
}

function onPopChange(t) {
  if (!pop || !t.matches('input[type=checkbox]')) return;
  if (t.checked) { pop.sel.add(t.value); pop.keep.add(t.value); } else { pop.sel.delete(t.value); pop.only = false; }   // ติ๊กออก → แสดงรายการทั้งหมดทันที (ไม่ต้องกด "+ เพิ่ม / เปลี่ยนรายการ")
  updatePopMeta();
}

function onPopClick(b) {
  if (b.dataset.pop === 'clear') {
    pop.sel.clear();
    pop.only = false;
    pop.el.querySelectorAll('input[type=checkbox]').forEach(i => { i.checked = false; });
    updatePopMeta();
  } else if (b.dataset.pop === 'only') {
    pop.only = !pop.only;
    updatePopMeta();
  } else {
    closePop(true, true);
  }
}

document.addEventListener('input', e => {
  const t = e.target;
  if (!t || !t.matches) return;
  if (t.matches('.mpq')) { updatePopMeta(); return; }
  if (t.matches('.ckq')) {
    const q = srchKey(t.value);
    $$(t.dataset.for + ' .ckb').forEach(l => { l.hidden = !!q && srchKey(l.textContent).indexOf(q) < 0; });
  }
});
window.addEventListener('scroll', () => placePop(), true);
window.addEventListener('resize', () => placePop());

/** ปุ่มตัวกรองประเภท / สาเหตุ ในสมุดคุมคำร้อง */
function msLabel(arr, all, noun, name) {
  if (!arr.length) return all;
  const names = arr.map(name);
  return names.length <= 2 ? names.join(', ') : noun + ' ' + names.length + ' รายการ';
}

function renderBookFilters() {
  const bt = $('#bt'), br = $('#br');
  if (!bt || !br) return;
  const put = (el, arr, label) => {
    el.innerHTML = '<span class="mst">' + esc(label) + '</span><span class="car" aria-hidden="true">▾</span>';
    el.dataset.on = arr.length ? '1' : '';
  };
  put(bt, state.bt, msLabel(state.bt, 'ทุกประเภท', 'ประเภท', x => x));
  put(br, state.br, msLabel(state.br, 'ทุกสาเหตุ', 'สาเหตุ', x => x === '__none' ? 'ยังไม่ระบุสาเหตุ' : x));
}

const THEAD = '<thead><tr><th>วันที่</th><th>เลขที่</th><th>ผู้ขอ</th><th>ที่อยู่ลูกค้า</th><th>ประเภทคำร้อง</th><th>เฟส · ขนาด</th><th>สายจดหน่วย</th><th>สถานะ</th><th>สาเหตุ</th></tr></thead>';

function rowHtml(r) {
  const size = r.size && r.size !== '-' ? ' · ' + esc(r.size) : '';
  return '<tr data-row="' + esc(r.id) + '">'
    + '<td data-label="วันที่">' + fmt(r.date) + '</td>'
    + '<td data-label="เลขที่">' + esc(r.no) + '</td>'
    + '<td data-label="ผู้ขอ">' + esc(r.name) + '</td>'
    + '<td class="addr" data-label="ที่อยู่">' + esc(r.address || '-') + '</td>'
    + '<td data-label="ประเภทคำร้อง">' + typeTags(r.type) + '</td>'
    + '<td data-label="เฟส · ขนาด">' + esc(r.phase && r.phase !== '-' ? r.phase : '-') + size + '</td>'
    + '<td data-label="สายจดหน่วย">' + esc(r.route) + '</td>'
    + '<td data-label="สถานะ">' + statusCell(r) + '</td>'
    + '<td class="why" data-label="สาเหตุ">' + reasonCell(r) + '</td></tr>';
}

function tableHtml(rows, emptyMsg, cls) {
  return rows.length
    ? '<div class="tablewrap' + (cls ? ' ' + cls : '') + '"><table>' + THEAD + '<tbody>' + rows.map(rowHtml).join('') + '</tbody></table></div>'
    : '<div class="panel empty">' + emptyMsg + '</div>';
}

/** จำนวนรายการต่อหน้า: สมุดคุมคำร้อง = 15 (ตามจำนวนแถวที่เห็น) หน้าอื่นใช้ PAGE_SIZE */
const listPageSize = () => (state.view === 'book' ? BOOK_VISIBLE_ROWS : PAGE_SIZE);
function pagerHtml(withRange) {
  const size = listPageSize(), total = state.total, cur = state.page, last = Math.max(0, state.pages - 1);
  const range = withRange
    ? '<span>แสดง ' + (total ? cur * size + 1 : 0) + '–' + Math.min((cur + 1) * size, total) + ' จาก ' + total.toLocaleString('th-TH') + ' รายการ</span>'
    : '';
  if (last < 1) return range;   // มีหน้าเดียว ไม่ต้องมีปุ่มเลือกหน้า

  // เลขหน้าที่แสดง: หน้าแรก, หน้าสุดท้าย, หน้าปัจจุบัน และหน้าข้าง ๆ ที่เหลือเป็น …
  const set = new Set([0, last, cur - 1, cur, cur + 1]);
  if (cur <= 2) { set.add(1); set.add(2); set.add(3); }
  if (cur >= last - 2) { set.add(last - 1); set.add(last - 2); set.add(last - 3); }
  const nums = [...set].filter(n => n >= 0 && n <= last).sort((a, b) => a - b);
  const btn = (to, label, aria, dis) => '<button class="pg" type="button" data-pgto="' + to + '" aria-label="' + aria + '"' + (dis ? ' disabled' : '') + '>' + label + '</button>';
  let out = btn(cur - 1, '‹', 'หน้าก่อนหน้า', cur === 0), prev = -1;
  nums.forEach(n => {
    if (prev >= 0 && n - prev > 1) out += '<span class="pgdots" aria-hidden="true">…</span>';
    out += n === cur
      ? '<button class="pg" type="button" aria-current="page" aria-label="หน้า ' + (n + 1) + ' (หน้าปัจจุบัน)">' + (n + 1) + '</button>'
      : btn(n, n + 1, 'ไปหน้า ' + (n + 1));
    prev = n;
  });
  out += btn(cur + 1, '›', 'หน้าถัดไป', cur >= last);
  return range + '<div class="pgs" role="group" aria-label="เลือกหน้า">' + out + '</div>';
}

/* เมนูแบบต้นไม้: สมุดคุมคำร้องขอใช้ไฟ (ทุกปี) > ปีต่าง ๆ  — เก็บปีเป็น ค.ศ. ในระบบ แสดงและใช้ในลิงก์เป็น พ.ศ. */
let treeSig = '';
function renderBookTree() {
  const box = $('#bookKids');
  if (!box) return;
  const years = (state.years || []).slice().reverse();
  const sig = years.join(',');
  if (sig !== treeSig) {
    treeSig = sig;
    box.innerHTML = years.map(y => '<a href="#book-' + (+y + 543) + '" data-v="book" data-y="' + y + '">สมุดคุมคำร้อง ปี ' + (+y + 543) + '</a>').join('');
  }
  $('#treeTog').hidden = !years.length;
  syncNav();
}
function syncNav() {
  const view = state.view, by = state.by;
  $$('nav a').forEach(a => {
    const on = a.dataset.v === view && (view !== 'book' || (a.dataset.y ? a.dataset.y === by : by === 'all'));
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (view === 'book' && by && by !== 'all') {   // เปิดปีใดอยู่ ให้กิ่งของปีนั้นกางไว้เสมอ
    $('#bookKids').classList.remove('collapsed');
    $('#treeTog').setAttribute('aria-expanded', 'true');
  }
}

function updateYearSelector() {
  renderBookTree();
  const w = $('#yearWrap'), s = $('#selYear'), years = state.years || [];
  if (!years.length || state.view === 'book' || state.view === 'daily') { w.hidden = true; return; }   // ใช้เฉพาะหน้าภาพรวม
  w.hidden = false;
  const sig = years.join(',') + '|' + state.year;
  if (s.dataset.sig === sig) return;
  s.dataset.sig = sig;
  s.innerHTML = '<option value="">ทุกปี</option>' + years.slice().reverse().map(y => '<option value="' + y + '">' + (+y + 543) + '</option>').join('');
  s.value = state.year;
}

/* =====================================================================
   6. หน้าภาพรวม
   ===================================================================== */
function barsSvg(items, attr, label) {
  const n = Math.max(items.length, 1);
  const mx = Math.max(5, ...items.map(i => i.c));
  const step = mx <= 10 ? 2 : mx <= 20 ? 5 : mx <= 50 ? 10 : mx <= 100 ? 20 : 100;
  const top = Math.ceil(mx / step) * step;
  const W = 760, H = 210, L = 40, R = 6, T = 14, B = 26, bw = (W - L - R) / n, ph = H - T - B;
  let g = '';
  for (let v = 0; v <= top; v += step) {
    const y = H - B - v / top * ph;
    g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>';
  }
  items.forEach((it, i) => {
    const x = L + i * bw, h = it.c / top * ph, w = Math.min(bw * .68, 56), bx = x + (bw - w) / 2;
    g += '<g class="colx" ' + attr + '="' + esc(it.k) + '"><title>' + esc(it.title || it.label) + '</title>'
      + '<rect class="hit" x="' + x + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B) + '"/>';
    if (it.c) {
      g += '<rect class="b' + (it.cur ? ' td' : '') + '" x="' + bx + '" y="' + (H - B - h) + '" width="' + w + '" height="' + h + '" rx="2"/>'
        + '<text class="cn" x="' + (x + bw / 2) + '" y="' + (H - B - h - 4) + '" text-anchor="middle">' + it.c + '</text>';
    }
    g += '<text x="' + (x + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(it.label) + '</text></g>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' + g + '</svg>';
}

function barList(map, colorFn, total) {
  const e = Object.entries(map || {}).sort((a, b) => b[1] - a[1]);
  if (!e.length) return '<div class="empty">ไม่มีข้อมูล</div>';
  const mx = Math.max(...e.map(x => x[1]));
  return e.map(([k, v], i) => {
    const c = colorFn(k, i);
    return '<div class="bl"><span class="bl-n"><i class="dot" style="background:' + c + '"></i>' + esc(k) + '</span>'
      + '<div class="bl-t"><i style="width:' + (v / mx * 100) + '%;background:' + c + '"></i></div>'
      + '<span class="bl-v"><b>' + v + '</b> · ' + Math.round(v / Math.max(total, 1) * 100) + '%</span></div>';
  }).join('');
}

function renderDashboard() {
  const s = state.summary;
  if (!s) return;
  state.frame = 'dashboard';
  const m = s.month, months = s.months || [], year = state.year, types = s.types || {};
  const sumOf = o => Object.values(o || {}).reduce((a, b) => a + b, 0);

  const monthOpts = months.slice().reverse()
    .map(x => '<option value="' + x + '"' + (x === m ? ' selected' : '') + '>' + fmtM(x) + '</option>').join('');

  const monthly = (year ? months : months.slice(-6)).slice().reverse().map(x => ({
    k: x, label: pkey(x + '-01').toLocaleDateString('th-TH', { month: 'short' }),
    c: s.byMonth[x] || 0, cur: x === m, title: fmtM(x) + ' · ' + (s.byMonth[x] || 0) + ' คำร้อง'
  }));
  const yearly = s.yearSummary.map(x => ({ k: x.key, label: String(+x.key + 543), c: x.total, title: 'ปี ' + (+x.key + 543) }));
  const daysInMonth = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  const daily = Array.from({ length: daysInMonth }, (_, i) => {
    const k = m + '-' + pad(i + 1), c = s.byDay[k] || 0;
    return { k, label: String(i + 1), c, cur: k === TODAY, title: fmt(k) + ' · ' + c + ' คำร้อง' };
  });

  const allTypes = [...new Set([...typeList(), ...Object.keys(types)])].filter(t => types[t] !== undefined);
  const monthRows = (s.monthSummary || []).filter(x => year ? x.key.startsWith(year) : true);
  const tbl = monthRows.slice(year ? 0 : -6).reverse().map(x =>
    '<tr><td>' + fmtM(x.key) + '</td><td class="n"><b>' + x.total + '</b></td>'
    + allTypes.map(t => '<td class="n">' + (x.types[t] || 0) + '</td>').join('')
    + '<td class="n">' + x.open + '</td></tr>').join('');
  const mcol = { 'ธรรมดา': 'var(--c2)', 'TOU': 'var(--c3)', 'EV': 'var(--c4)', '1P': 'var(--c1)', '3P': 'var(--c5)' };

  $('#view').innerHTML =
    '<div class="head"><div><h2>ภาพรวมคำร้อง ' + fmtM(m) + '</h2><div class="sub">'
    + (year ? 'ปี พ.ศ. ' + (+year + 543) : 'ทุกปี') + ' · ' + s.total.toLocaleString('th-TH') + ' รายการ</div></div>'
    + '<div class="sp"></div><div class="ctl"><label class="sub" for="selMonth">เดือน</label><select id="selMonth">' + monthOpts + '</select></div></div>'

    + '<div class="kpis">'
    + '<div class="kpi"><div class="l">คำร้องวันนี้</div><div class="v">' + s.today + '</div><div class="d">เมื่อวาน ' + s.yesterday + ' รายการ</div></div>'
    + '<div class="kpi"><div class="l">คำร้องเดือนนี้</div><div class="v">' + s.monthTotal + '</div><div class="d">'
    + (s.previousMonthTotal == null ? 'ยังไม่มีเดือนก่อนหน้า' : 'เดือนก่อน ' + s.previousMonthTotal + ' รายการ') + '</div></div>'
    + '<div class="kpi open"><div class="l">รอผลตรวจ</div><div class="v">' + s.open + '</div><div class="d">ยังไม่ระบุผ่าน/ไม่ผ่าน</div></div>'
    + '<div class="kpi"><div class="l">ตรวจแล้วเดือนนี้</div><div class="v">' + s.doneMonth + '</div><div class="d">'
    + (s.monthTotal ? Math.round(s.doneMonth / s.monthTotal * 100) : 0) + '% ของคำร้องเดือนนี้</div></div>'
    + '</div>'

    + '<div class="panel mb"><h3>' + (year ? 'จำนวนคำร้องรายเดือน ปี ' + (+year + 543) : 'จำนวนคำร้องรายปี') + '</h3>'
    + '<div class="hint">คลิกแท่งกราฟเพื่อเลือกปีหรือเดือน</div>'
    + '<div class="scroll">' + barsSvg(year ? monthly : yearly, year ? 'data-month' : 'data-y', 'จำนวนคำร้อง') + '</div></div>'

    + '<div class="panel mb"><h3>จำนวนคำร้องรายวัน</h3><div class="hint">คลิกแท่งเพื่อดูรายการของวันนั้น</div>'
    + '<div class="scroll">' + barsSvg(daily, 'data-day', 'จำนวนคำร้องรายวัน') + '</div></div>'

    + '<div class="grid">'
    + '<div class="panel"><h3>แยกตามประเภทคำร้อง</h3><div class="hint">เฉพาะ ' + fmtM(m) + ' · คำร้องที่มีหลายประเภทนับในทุกประเภทที่มี</div>'
    + barList(types, k => TCOL[typeIdx(k)], s.monthTotal) + '</div>'
    + '<div class="panel"><h3>เฟส</h3><div class="hint">นับเฉพาะงานที่ระบุข้อมูล</div>'
    + barList(s.phases, k => mcol[k] || 'var(--c6)', sumOf(s.phases)) + '</div>'
    + '</div>'

    + '<div class="panel"><h3>สรุปรายเดือน</h3><div class="hint">' + (year ? 'ทุกเดือนของปีที่เลือก' : '6 เดือนล่าสุดที่มีข้อมูล') + '</div>'
    + '<div class="scroll"><table><thead><tr><th>เดือน</th><th class="n">รวม</th>'
    + allTypes.map(t => '<th class="n">' + esc(t) + '</th>').join('') + '<th class="n">ค้าง</th></tr></thead><tbody>' + tbl + '</tbody></table></div></div>';
}

      + '<input type="search" id="fq" placeholder="ค้นหาเลขที่ ชื่อ สายจดหน่วย" value="' + esc(state.q) + '" style="min-width:230px">'

      + '<div class="bk-years" id="bkYears" role="group" aria-label="เลือกปี พ.ศ."></div>'
      + '<div class="bk-months" id="bkMonths" role="group" aria-label="เลือกเดือน"></div>'
      + '<div class="ctl mb">'
      + '<input type="search" id="bq" placeholder="ค้นหาเลขที่ ชื่อ สายจดหน่วย" value="' + esc(state.bq) + '" style="min-width:230px">'
      + '<label class="sub" for="bd">วันที่</label><select id="bd" aria-label="เลือกวันที่ของเดือนที่เลือก"></select>'
      + '<button class="btn msf" type="button" id="bt" data-ms="bt" aria-haspopup="dialog" aria-label="กรองตามประเภท"></button>'
      + '<button class="btn msf" type="button" id="br" data-ms="br" aria-haspopup="dialog" aria-label="กรองตามสาเหตุ"></button>'

      + '</div>'
      + '<div class="bk-hint">คลิกแถวเพื่อดูรายละเอียดและจัดการคำร้อง</div>'
      + '<div id="tbl"><div class="panel empty">กำลังโหลดคำร้อง…</div></div><div class="pager" id="pager"></div>';

}

function renderDailyHead() {
